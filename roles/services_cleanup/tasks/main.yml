---
# Aufgaben für Services Cleanup und Attack Surface Reduction

- name: Ungenutzte und unsichere Pakete deinstallieren
  ansible.builtin.apt:
    name: "{{ unwanted_packages }}"
    state: absent
    purge: true
  when: ansible_os_family == "Debian"

- name: Kritische Dateiberechtigungen für /etc/shadow setzen
  ansible.builtin.file:
    path: /etc/shadow
    owner: root
    group: root
    mode: "0600"

- name: Kritische Dateiberechtigungen für /etc/gshadow setzen
  ansible.builtin.file:
    path: /etc/gshadow
    owner: root
    group: root
    mode: "0600"

- name: Kritische Dateiberechtigungen für /etc/passwd setzen
  ansible.builtin.file:
    path: /etc/passwd
    owner: root
    group: root
    mode: "0644"

- name: Kritische Dateiberechtigungen für /etc/group setzen
  ansible.builtin.file:
    path: /etc/group
    owner: root
    group: root
    mode: "0644"
- name: Berechtigungen für Cron-Dateien und Ordner strikt setzen (CIS 5.1.x)
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0700" # Für Ordner (oder 0600 für Dateien, Ansible file modul löst das bei Ordnern mit 0700 am besten)
    state: "{{ 'directory' if not item.endswith('crontab') else 'file' }}"
  loop:
    - /etc/crontab
    - /etc/cron.hourly
    - /etc/cron.daily
    - /etc/cron.weekly
    - /etc/cron.monthly
    - /etc/cron.d

- name: Berechtigungen für GRUB-Bootloader-Konfiguration absichern (CIS 1.4.1)
  ansible.builtin.file:
    path: /boot/grub/grub.cfg
    owner: root
    group: root
    mode: "0400"
  ignore_errors: true # Falls der Pfad je nach Ubuntu-Version leicht abweicht (z.B. grub2)

- name: Sichern des /tmp Verzeichnisses mit nodev, nosuid, noexec (CIS 1.1.2 - 1.1.4)
  ansible.posix.mount:
    path: /tmp
    src: tmpfs
    fstype: tmpfs
    opts: defaults,rw,nosuid,nodev,noexec,relatime
    state: mounted
