---
- name: Auditd (Advanced Auditing) Paket installieren
  ansible.builtin.apt:
    name: auditd
    state: "{{ auditd_package_state }}"
    update_cache: true

- name: Auditd Dienst aktivieren und starten
  ansible.builtin.service:
    name: auditd
    state: "{{ auditd_service_state }}"
    enabled: "{{ auditd_service_enabled }}"

- name: Wichtige Systemdateien überwachen (CIS-konforme Basisregeln)
  ansible.builtin.lineinfile:
    path: /etc/audit/rules.d/audit.rules
    line: "{{ item }}"
    create: true
    mode: '0640'
    owner: root
    group: root
  loop:
    - "-w /etc/passwd -p wa -k identity"
    - "-w /etc/group -p wa -k identity"
    - "-w /etc/shadow -p wa -k identity"
    - "-w /etc/sudoers -p wa -k scope"
  notify: Auditd neu starten
