---
# Aufgaben für die UFW-Firewall-Konfiguration

- name: UFW (Uncomplicated Firewall) installieren
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: UFW Standard-Policy für eingehenden Traffic setzen (Deny)
  community.general.ufw:
    direction: incoming
    policy: "{{ ufw_default_incoming }}"

- name: UFW Standard-Policy für ausgehenden Traffic setzen (Allow)
  community.general.ufw:
    direction: outgoing
    policy: "{{ ufw_default_outgoing }}"

- name: Erlaubte Ports freigeben
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_ports }}"

- name: UFW aktivieren und beim Systemstart starten
  community.general.ufw:
    state: enabled
