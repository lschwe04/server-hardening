---
# Standard-Variablen für das Patch-Management

# Automatische Updates aktivieren
patch_management_automatic_upgrades: 1

# Welche Updates eingespielt werden sollen (hier: nur Sicherheitsupdates)
patch_management_origins_patterns:
  - "origin=Ubuntu,archive=${distro_codename}-security"

# E-Mail-Adresse für Benachrichtigungen bei Fehlern (leer lassen für keine)
patch_management_unattended_mail: ""

# Automatischen Neustart erlauben, falls ein Kernel-Update es erfordert (true/false)
patch_management_unattended_automatic_reboot: true

# Uhrzeit für den automatischen Neustart (im Format "HH:MM", z. B. "03:00")
patch_management_unattended_automatic_reboot_time: "03:00"
