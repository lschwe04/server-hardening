---
# Aufgaben für File Integrity Monitoring (AIDE)

- name: AIDE Paket auf Debian/Ubuntu installieren
  ansible.builtin.apt:
    name: aide
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Prüfen ob AIDE-Datenbank bereits existiert
  ansible.builtin.stat:
    path: /var/lib/aide/aide.db
  register: file_integrity_aide_db_file

- name: AIDE-Datenbank initialisieren (Kann je nach System einige Minuten dauern)
  ansible.builtin.command: aideinit
  args:
    creates: /var/lib/aide/aide.db
  when: not file_integrity_aide_db_file.stat.exists and file_integrity_aide_init_on_install
