---
# Standard-Variablen für die access_control Rolle

# SSH-Konfiguration
access_control_ssh_port: 22
access_control_ssh_permit_root_login: "no"
access_control_ssh_password_authentication: "no"
access_control_ssh_pubkey_authentication: "yes"
access_control_ssh_x11_forwarding: "no"
access_control_ssh_max_auth_tries: 3
access_control_ssh_client_alive_interval: 300
access_control_ssh_client_alive_count_max: 2

# Erlaubte Benutzer (leer lassen oder spezifischen Admin-User angeben, z. B. ['admin'])
access_control_ssh_allowed_users: []
# Passwörter / Login-Limits
access_control_password_max_days: 90
access_control_password_min_days: 7
access_control_password_warning_days: 14

password_max_days: 90
password_min_days: 7
password_warning_days: 14
