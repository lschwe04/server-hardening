---
# Zentrales Ansible Playbook für Linux Server Hardening

- name: Server absichern und härten
  hosts: servers
  become: true
  gather_facts: true

  roles:
    - role: access_control
    - role: user_management
    - role: auditd
    - role: firewall
    - role: intrusion_prevention
    - role: kernel_hardening
    - role: patch_management
    - role: services_cleanup
    - role: file_integrity
    - role: banner

